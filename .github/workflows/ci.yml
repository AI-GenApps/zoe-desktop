name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and build web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test release scripts
        run: pnpm test:release-scripts

      - name: Build web bundle
        run: pnpm build

  installers:
    name: Build unsigned ${{ matrix.platform }} installer
    needs: check
    if: ${{ github.event_name != 'push' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: windows
            runner: windows-latest
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe
    env:
      VITE_APP_VERSION: 0.0.0-ci.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write CI Tauri version overlay
        shell: bash
        run: node scripts/release/write-tauri-overlay.mjs --version "$VITE_APP_VERSION" --output "$RUNNER_TEMP/tauri-ci-overlay.json"

      - name: Build unsigned installer
        shell: bash
        run: pnpm tauri:build --config "$RUNNER_TEMP/tauri-ci-overlay.json"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: zoe-desktop-${{ matrix.platform }}-${{ github.run_id }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7
